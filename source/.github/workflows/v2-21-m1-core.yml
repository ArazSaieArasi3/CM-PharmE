name: CM-PharmE 2.1 M1 Isolated Core
on:
  pull_request:
    branches: [v2/research-program]
    paths:
      - 'v2/ontology/profiles/2.1/m1-provenance/0.1.0/**'
      - 'v2/ontology/candidates/2.1.0-alpha.1-p3-facility-operation/active.ttl'
      - 'v2/ontology/candidates/2.1.0-alpha.1-p3-facility-operation/constraints.ttl'
      - 'v2/data/migrations/2.1/0.2.0/**'
      - 'v2/data/db/schema.sql'
      - 'tools/v2_ontology/CheckOWL2DL.java'
      - 'v2/release/2.1/core/0.1.0/inventory.json'
      - '.github/workflows/v2-21-m1-core.yml'
  push:
    branches: ['v2/**']
    paths:
      - 'v2/ontology/profiles/2.1/m1-provenance/0.1.0/**'
      - 'v2/ontology/candidates/2.1.0-alpha.1-p3-facility-operation/active.ttl'
      - 'v2/ontology/candidates/2.1.0-alpha.1-p3-facility-operation/constraints.ttl'
      - 'v2/data/migrations/2.1/0.2.0/**'
      - 'v2/data/db/schema.sql'
      - 'tools/v2_ontology/CheckOWL2DL.java'
      - 'v2/release/2.1/core/0.1.0/inventory.json'
      - '.github/workflows/v2-21-m1-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-provenance-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned profile verification dependencies
        run: python -m pip install --disable-pip-version-check -r v2/ontology/profiles/2.1/m1-provenance/0.1.0/requirements-verify.txt
      - name: Record exact execution identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('build/m1-provenance-profile')
          out.mkdir(parents=True, exist_ok=True)
          keys = ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_EVENT_NAME', 'GITHUB_WORKFLOW_REF']
          (out / 'execution.json').write_text(json.dumps({key: os.environ[key] for key in keys}, indent=2) + '\n')
          PY
      - name: Execute frozen admission, isolation, query and formal oracles
        run: python v2/ontology/profiles/2.1/m1-provenance/0.1.0/verify_profile.py
      - name: Upload exact bounded evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-21-m1-core-evidence
          path: build/m1-provenance-profile/
          if-no-files-found: warn
          retention-days: 30
