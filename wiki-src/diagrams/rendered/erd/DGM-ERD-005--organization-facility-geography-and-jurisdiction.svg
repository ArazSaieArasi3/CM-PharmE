<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 998" role="img" aria-labelledby="title desc">
<title id="title">DGM-ERD-005 Organization, Facility, Geography and Jurisdiction</title>
<desc id="desc">Show organization/facility identities, geographic normalization and regulatory-jurisdiction separation.</desc>
<defs><marker id="fk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker><style>text{font-family:sans-serif}.box{fill:white;stroke:currentColor}.fk{stroke-dasharray:4 3}.head{font-weight:bold}</style></defs>
<line class="fk" x1="400" y1="207.0" x2="345" y2="216.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="207.5" text-anchor="middle" font-size="9">geography_id · 1 → 1</text>
<line class="fk" x1="190.0" y1="402" x2="190.0" y2="332" stroke="currentColor" marker-end="url(#fk)"/>
<text x="190.0" y="363.0" text-anchor="middle" font-size="9">geography_id · 0..1 → 1</text>
<line class="fk" x1="190.0" y1="632" x2="190.0" y2="332" stroke="currentColor" marker-end="url(#fk)"/>
<text x="190.0" y="478.0" text-anchor="middle" font-size="9">geography_id · 0..1 → 1</text>
<line class="fk" x1="555.0" y1="632" x2="555.0" y2="544" stroke="currentColor" marker-end="url(#fk)"/>
<text x="555.0" y="584.0" text-anchor="middle" font-size="9">organization_id · 1 → 1</text>
<line class="fk" x1="400" y1="730.0" x2="345" y2="712.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="717.0" text-anchor="middle" font-size="9">facility_id · 1 → 1</text>
<rect class="box" x="35" y="100" width="310" height="232" rx="6"/>
<text class="head" x="190.0" y="122" text-anchor="middle" font-size="14">geography</text>
<line x1="35" y1="134" x2="345" y2="134" stroke="currentColor"/>
<text x="45" y="154" font-size="10">[PK] geography_id : BIGSERIAL</text>
<text x="45" y="172" font-size="10">public_id : TEXT</text>
<text x="45" y="190" font-size="10">geography_type : TEXT</text>
