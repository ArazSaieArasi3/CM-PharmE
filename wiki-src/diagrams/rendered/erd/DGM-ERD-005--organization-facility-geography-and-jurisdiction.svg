<text x="410" y="794" font-size="10">ontology_iri : TEXT</text>
<text x="35" y="953" font-size="10">Crow&apos;s-foot semantics are expressed by FK direction/cardinality labels: each child FK points to its parent; nullable FKs permit 0..1 parent. Parent-side child multiplicity is 0..* unless constrained otherwise.</text>
