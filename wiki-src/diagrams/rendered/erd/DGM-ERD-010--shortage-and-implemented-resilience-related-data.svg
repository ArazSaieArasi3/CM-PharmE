<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 1034" role="img" aria-labelledby="title desc">
<title id="title">DGM-ERD-010 Shortage and Implemented Resilience-Related Data</title>
<desc id="desc">Show the implemented shortage realization. Dedicated SupplyDependency, Vulnerability and risk-treatment tables are not present in the current schema.</desc>
<defs><marker id="fk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker><style>text{font-family:sans-serif}.box{fill:white;stroke:currentColor}.fk{stroke-dasharray:4 3}.head{font-weight:bold}</style></defs>
<line class="fk" x1="345" y1="216.0" x2="400" y2="180.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="194.0" text-anchor="middle" font-size="9">medicinal_product_id · 0..1 → 1</text>
<line class="fk" x1="190.0" y1="332" x2="190.0" y2="402" stroke="currentColor" marker-end="url(#fk)"/>
<text x="190.0" y="363.0" text-anchor="middle" font-size="9">product_presentation_id · 0..1 → 1</text>
<line class="fk" x1="345" y1="216.0" x2="400" y2="482.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="345.0" text-anchor="middle" font-size="9">regulatory_jurisdiction_id · 0..1 → 1</text>
<line class="fk" x1="190.0" y1="332" x2="190.0" y2="668" stroke="currentColor" marker-end="url(#fk)"/>
<text x="190.0" y="496.0" text-anchor="middle" font-size="9">source_record_id · 0..1 → 1</text>
<line class="fk" x1="345" y1="500.0" x2="400" y2="180.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="336.0" text-anchor="middle" font-size="9">medicinal_product_id · 1 → 1</text>
<rect class="box" x="35" y="100" width="310" height="232" rx="6"/>
<text class="head" x="190.0" y="122" text-anchor="middle" font-size="14">medicine_shortage_situation</text>
<line x1="35" y1="134" x2="345" y2="134" stroke="currentColor"/>
<text x="45" y="154" font-size="10">[PK] shortage_id : BIGSERIAL</text>
