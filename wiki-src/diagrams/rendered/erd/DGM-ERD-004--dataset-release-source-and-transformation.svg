<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 750" role="img" aria-labelledby="title desc">
<title id="title">DGM-ERD-004 Dataset, Release, Source and Transformation</title>
<desc id="desc">Show the source-ingestion and execution-provenance backbone.</desc>
<defs><marker id="fk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker><style>text{font-family:sans-serif}.box{fill:white;stroke:currentColor}.fk{stroke-dasharray:4 3}.head{font-weight:bold}</style></defs>
<line class="fk" x1="400" y1="198.0" x2="345" y2="198.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="194.0" text-anchor="middle" font-size="9">dataset_id · 1 → 1</text>
<line class="fk" x1="555.0" y1="366" x2="555.0" y2="296" stroke="currentColor" marker-end="url(#fk)"/>
<text x="555.0" y="327.0" text-anchor="middle" font-size="9">dataset_release_id · 1 → 1</text>
<line class="fk" x1="400" y1="464.0" x2="345" y2="473.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="464.5" text-anchor="middle" font-size="9">transformation_run_id · 0..1 → 1</text>
