<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 804" role="img" aria-labelledby="title desc">
<title id="title">DGM-ERD-007 Identifier, Identity and Entity Match</title>
<desc id="desc">Show identifier assignment and auditable entity matching without collapsing identifier values into entity identity.</desc>
<defs><marker id="fk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker><style>text{font-family:sans-serif}.box{fill:white;stroke:currentColor}.fk{stroke-dasharray:4 3}.head{font-weight:bold}</style></defs>
<line class="fk" x1="400" y1="207.0" x2="345" y2="171.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="185.0" text-anchor="middle" font-size="9">identifier_scheme_id · 1 → 1</text>
<line class="fk" x1="555.0" y1="314" x2="555.0" y2="384" stroke="currentColor" marker-end="url(#fk)"/>
<text x="555.0" y="345.0" text-anchor="middle" font-size="9">source_record_id · 0..1 → 1</text>
<line class="fk" x1="345" y1="509.0" x2="400" y2="482.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="491.5" text-anchor="middle" font-size="9">source_record_a_id · 1 → 1</text>
<line class="fk" x1="345" y1="509.0" x2="400" y2="482.0" stroke="currentColor" marker-end="url(#fk)"/>
<text x="372.5" y="491.5" text-anchor="middle" font-size="9">source_record_b_id · 1 → 1</text>
<rect class="box" x="35" y="100" width="310" height="142" rx="6"/>
<text class="head" x="190.0" y="122" text-anchor="middle" font-size="14">identifier_scheme</text>
<line x1="35" y1="134" x2="345" y2="134" stroke="currentColor"/>
<text x="45" y="154" font-size="10">[PK] identifier_scheme_id : BIGSERIAL</text>
<text x="45" y="172" font-size="10">public_id : TEXT</text>
<text x="45" y="190" font-size="10">scheme_name : TEXT</text>
<text x="45" y="208" font-size="10">ontology_iri : TEXT</text>
<rect class="box" x="400" y="100" width="310" height="214" rx="6"/>
<text class="head" x="555.0" y="122" text-anchor="middle" font-size="14">identifier_assignment</text>
<line x1="400" y1="134" x2="710" y2="134" stroke="currentColor"/>
<text x="410" y="154" font-size="10">[PK] identifier_assignment_id : BIGSERIAL</text>
<text x="410" y="172" font-size="10">public_id : TEXT</text>
<text x="410" y="190" font-size="10">[FK] identifier_scheme_id : BIGINT</text>
<text x="410" y="208" font-size="10">entity_type : TEXT</text>
<text x="410" y="226" font-size="10">entity_public_id : TEXT</text>
<text x="410" y="244" font-size="10">lexical_value : TEXT</text>
<text x="410" y="262" font-size="10">[FK] source_record_id : BIGINT</text>
<text x="410" y="280" font-size="10">ontology_iri : TEXT</text>
<rect class="box" x="35" y="384" width="310" height="250" rx="6"/>
<text class="head" x="190.0" y="406" text-anchor="middle" font-size="14">entity_match_assertion</text>
<line x1="35" y1="418" x2="345" y2="418" stroke="currentColor"/>
<text x="45" y="438" font-size="10">[PK] entity_match_assertion_id : BIGSERIAL</text>
<text x="45" y="456" font-size="10">public_id : TEXT</text>
<text x="45" y="474" font-size="10">[FK] source_record_a_id : BIGINT</text>
<text x="45" y="492" font-size="10">[FK] source_record_b_id : BIGINT</text>
<text x="45" y="510" font-size="10">matched_entity_type : TEXT</text>
<text x="45" y="528" font-size="10">matched_public_id : TEXT</text>
<text x="45" y="546" font-size="10">method : TEXT</text>
<text x="45" y="564" font-size="10">confidence : NUMERIC(5,4)</text>
<text x="45" y="582" font-size="10">status : TEXT</text>
<text x="45" y="600" font-size="10">ontology_iri : TEXT</text>
<rect class="box" x="400" y="384" width="310" height="196" rx="6"/>
<text class="head" x="555.0" y="406" text-anchor="middle" font-size="14">source_record</text>
<line x1="400" y1="418" x2="710" y2="418" stroke="currentColor"/>
<text x="410" y="438" font-size="10">[PK] source_record_id : BIGSERIAL</text>
<text x="410" y="456" font-size="10">[FK] dataset_release_id : BIGINT</text>
<text x="410" y="474" font-size="10">[FK] transformation_run_id : BIGINT</text>
<text x="410" y="492" font-size="10">row_number : BIGINT</text>
<text x="410" y="510" font-size="10">source_hash : CHAR(64)</text>
<text x="410" y="528" font-size="10">raw_key : JSONB</text>
<text x="410" y="546" font-size="10">ontology_iri : TEXT</text>
<text x="35" y="759" font-size="10">Crow&apos;s-foot semantics are expressed by FK direction/cardinality labels: each child FK points to its parent; nullable FKs permit 0..1 parent. Parent-side child multiplicity is 0..* unless constrained otherwise.</text>
</svg>
