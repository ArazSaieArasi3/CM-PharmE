s-serif" font-size="14" fill="#24292f">accepted / ambiguous</text><text x="1045" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#24292f">/ rejected</text><line x1="175" y1="121" x2="197" y2="121" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="350" y1="121" x2="372" y2="121" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="525" y1="121" x2="547" y2="86" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="525" y1="121" x2="547" y2="176" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="710" y1="86" x2="737" y2="86" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="915" y1="176" x2="942" y2="176" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="312" font-family="sans-serif" font-size="11" fill="#57606a">CM-PharmE V2 reference/research realization; ontology remains semantic authority.</text></svg>
