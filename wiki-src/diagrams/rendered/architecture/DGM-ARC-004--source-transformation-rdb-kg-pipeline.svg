<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" data-theme-safe="true" style="color:#24292f;background:#ffffff">
<title id="title">DGM-ARC-004 — Source → transformation → RDB → KG</title><desc id="desc">Reference pipeline from admitted source contract/fixture through provenance-aware relational realization and mapping registry to deterministic RDF/KG and query paths.</desc>
