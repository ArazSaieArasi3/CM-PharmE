<title id="title">DGM-ARC-006 — Ontology ↔ RDB ↔ RDF/KG mapping</title><desc id="desc">Semantic authority remains in OWL/SHACL; the registry documents direct and explicitly non-direct realization rules into the relational schema and deterministic RDF projection.</desc>
