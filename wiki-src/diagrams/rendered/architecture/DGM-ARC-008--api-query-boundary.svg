<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc" data-theme-safe="true" style="color:#24292f;background:#ffffff">
<title id="title">DGM-ARC-008 — API / query boundary</title><desc id="desc">The OpenAPI 3.1 contract exposes bounded read-only research query surfaces, including provenance lookup by source_hash, without implying a deployed production service.</desc>
