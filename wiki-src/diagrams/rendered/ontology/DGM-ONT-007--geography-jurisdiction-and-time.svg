<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 803" role="img" aria-labelledby="title desc" data-theme-safe="true" style="color:#24292f;background:#ffffff">
<title id="title">DGM-ONT-007 Geography, Jurisdiction and Time</title>
<desc id="desc">Separate geographic identity, regulatory jurisdiction and temporal/data-value context while preserving protected distinctions.</desc>
<rect id="diagram-background" x="0" y="0" width="100%" height="100%" fill="#ffffff" stroke="none" pointer-events="none" />
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" /></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="white" stroke="currentColor" /></marker><style>text{font-family:sans-serif}.node{fill:white;stroke:currentColor}.note{fill:white;stroke:currentColor;stroke-dasharray:5 4}.prot{stroke-dasharray:6 5}.dtype{stroke-dasharray:4 3}.relator{stroke-width:2}.edge-label{font-size:10px}</style></defs>
<text x="182.5" y="34" text-anchor="middle" font-size="17" font-weight="bold">Geography</text>
<text x="532.5" y="34" text-anchor="middle" font-size="17" font-weight="bold">Jurisdiction / protected</text>
<text x="532.5" y="53" text-anchor="middle" font-size="17" font-weight="bold">boundaries</text>
<text x="882.5" y="34" text-anchor="middle" font-size="17" font-weight="bold">Datatypes / context</text>
<line x1="173.5" y1="237.0" x2="173.5" y2="201.0" stroke="currentColor" marker-end="url(#inherit)" />
<line x1="173.5" y1="369.0" x2="173.5" y2="201.0" stroke="currentColor" marker-end="url(#inherit)" />
<line x1="173.5" y1="201.0" x2="173.5" y2="237.0" stroke="currentColor" marker-end="url(#arr)" />
<text class="edge-label" x="165.5" y="219.0" text-anchor="middle">withinRegion</text>
<line x1="173.5" y1="201.0" x2="173.5" y2="369.0" stroke="currentColor" marker-end="url(#arr)" />
<text class="edge-label" x="165.5" y="285.0" text-anchor="middle">withinCountry</text>
<line x1="490.1" y1="501.0" x2="224.9" y2="201.0" stroke="currentColor" marker-end="url(#arr)" />
<text class="edge-label" x="363.5" y="345.7" text-anchor="middle">locatedIn</text>
<line class="prot" x1="309.8" y1="201.0" x2="405.2" y2="237.0" stroke="currentColor" />
<text class="edge-label" x="354.7" y="226.5" text-anchor="middle">≠ protected</text>
<line class="prot" x1="390.0" y1="153.0" x2="325.0" y2="153.0" stroke="currentColor" />
<text class="edge-label" x="357.5" y="145.0" text-anchor="middle">≠ protected</text>
<rect class="node" x="40" y="105" width="285" height="96" rx="5" />
<text x="182.5" y="129" text-anchor="middle" font-size="13" font-weight="bold">Geographic Feature</text>
<text x="182.5" y="187" text-anchor="middle" font-size="11">«Kind»</text>
<rect class="node" x="40" y="237" width="285" height="96" rx="5" />
<text x="182.5" y="261" text-anchor="middle" font-size="13" font-weight="bold">Administrative Region</text>
<text x="182.5" y="319" text-anchor="middle" font-size="11">«Subkind»</text>
<rect class="node" x="40" y="369" width="285" height="96" rx="5" />
<text x="182.5" y="393" text-anchor="middle" font-size="13" font-weight="bold">Country</text>
<text x="182.5" y="451" text-anchor="middle" font-size="11">«Subkind»</text>
<rect class="node" x="390" y="105" width="285" height="96" rx="5" />
<text x="532.5" y="129" text-anchor="middle" font-size="13" font-weight="bold">Facility</text>
<text x="532.5" y="187" text-anchor="middle" font-size="11">«Kind»</text>
<rect class="node" x="390" y="237" width="285" height="96" rx="5" />
<text x="532.5" y="261" text-anchor="middle" font-size="13" font-weight="bold">Regulatory Jurisdiction</text>
<text x="532.5" y="319" text-anchor="middle" font-size="11">«Kind»</text>
<rect class="note" x="390" y="501" width="285" height="96" rx="5" />
<text x="532.5" y="525" text-anchor="middle" font-size="13" font-weight="bold">locatedIn: domain unspecified</text>
<text x="532.5" y="583" text-anchor="middle" font-size="11">«constraint note»</text>
<rect class="node dtype" x="740" y="105" width="285" height="96" rx="5" />
<text x="882.5" y="129" text-anchor="middle" font-size="13" font-weight="bold">Geospatial Position</text>
<text x="882.5" y="187" text-anchor="middle" font-size="11">«Datatype»</text>
<rect class="node dtype" x="740" y="237" width="285" height="96" rx="5" />
<text x="882.5" y="261" text-anchor="middle" font-size="13" font-weight="bold">Address</text>
<text x="882.5" y="319" text-anchor="middle" font-size="11">«Datatype»</text>
<rect class="node dtype" x="740" y="369" width="285" height="96" rx="5" />
<text x="882.5" y="393" text-anchor="middle" font-size="13" font-weight="bold">Time Interval</text>
<text x="882.5" y="451" text-anchor="middle" font-size="11">«Datatype»</text>
<rect class="node dtype" x="740" y="501" width="285" height="96" rx="5" />
<text x="882.5" y="525" text-anchor="middle" font-size="13" font-weight="bold">Reporting Period</text>
<text x="882.5" y="583" text-anchor="middle" font-size="11">«Datatype»</text>
<text x="40" y="717" font-size="11">Legend: stereotype text carries semantics; dashed boxes are notes/datatypes; thick borders mark Relators; hollow triangle = subClassOf.</text>
<text x="40" y="739" font-size="11">Dashed protected lines mean only registered inequality. No cardinality, equivalence or extra endpoint is implied by layout.</text>
</svg>
