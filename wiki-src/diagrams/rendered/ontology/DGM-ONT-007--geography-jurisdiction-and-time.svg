<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 665" role="img" aria-labelledby="title desc">
<title id="title">DGM-ONT-007 Geography, Jurisdiction and Time</title>
<desc id="desc">Separate geographic identity, regulatory jurisdiction and temporal/data-value context while preserving protected distinctions.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="white" stroke="currentColor"/></marker><style>text{font-family:sans-serif}.node{fill:white;stroke:currentColor}.note{fill:white;stroke:currentColor;stroke-dasharray:5 4}.prot{stroke-dasharray:6 5}.dtype{stroke-dasharray:4 3}.relator{stroke-width:2}</style></defs>
<text x="170.0" y="42" text-anchor="middle" font-size="18" font-weight="bold">Geography</text>
<text x="500.0" y="42" text-anchor="middle" font-size="18" font-weight="bold">Jurisdiction / protected boundaries</text>
<text x="830.0" y="42" text-anchor="middle" font-size="18" font-weight="bold">Datatypes / context</text>
<line x1="170.0" y1="236.0" x2="170.0" y2="131.0" stroke="currentColor" marker-end="url(#inherit)"/>
<text x="170.0" y="177.5" text-anchor="middle" font-size="11">subClassOf</text>
<line x1="170.0" y1="341.0" x2="170.0" y2="131.0" stroke="currentColor" marker-end="url(#inherit)"/>
<text x="170.0" y="230.0" text-anchor="middle" font-size="11">subClassOf</text>
<line x1="170.0" y1="131.0" x2="170.0" y2="236.0" stroke="currentColor" marker-end="url(#arr)"/>
<text x="170.0" y="177.5" text-anchor="middle" font-size="11">withinRegion</text>
<line x1="170.0" y1="131.0" x2="170.0" y2="341.0" stroke="currentColor" marker-end="url(#arr)"/>
<text x="170.0" y="230.0" text-anchor="middle" font-size="11">withinCountry</text>
<line x1="500.0" y1="446.0" x2="170.0" y2="131.0" stroke="currentColor" marker-end="url(#arr)"/>
<text x="335.0" y="282.5" text-anchor="middle" font-size="11">locatedIn</text>
<line class="prot" x1="170.0" y1="131.0" x2="500.0" y2="236.0" stroke="currentColor"/>
<text x="335.0" y="177.5" text-anchor="middle" font-size="11">≠ protected distinction</text>
<line class="prot" x1="500.0" y1="131.0" x2="170.0" y2="131.0" stroke="currentColor"/>
<text x="335.0" y="125.0" text-anchor="middle" font-size="11">≠ protected distinction</text>
<rect class="node" x="35" y="95" width="270" height="72" rx="5"/>
<text x="170.0" y="123" text-anchor="middle" font-size="14" font-weight="bold">Geographic Feature</text>
<text x="170.0" y="147" text-anchor="middle" font-size="12">«Kind»</text>
<rect class="node" x="35" y="200" width="270" height="72" rx="5"/>
<text x="170.0" y="228" text-anchor="middle" font-size="14" font-weight="bold">Administrative Region</text>
<text x="170.0" y="252" text-anchor="middle" font-size="12">«Subkind»</text>
<rect class="node" x="35" y="305" width="270" height="72" rx="5"/>
<text x="170.0" y="333" text-anchor="middle" font-size="14" font-weight="bold">Country</text>
<text x="170.0" y="357" text-anchor="middle" font-size="12">«Subkind»</text>
<rect class="node" x="365" y="95" width="270" height="72" rx="5"/>
<text x="500.0" y="123" text-anchor="middle" font-size="14" font-weight="bold">Facility</text>
<text x="500.0" y="147" text-anchor="middle" font-size="12">«Kind»</text>
<rect class="node" x="365" y="200" width="270" height="72" rx="5"/>
<text x="500.0" y="228" text-anchor="middle" font-size="14" font-weight="bold">Regulatory Jurisdiction</text>
<text x="500.0" y="252" text-anchor="middle" font-size="12">«Kind»</text>
<rect class="note" x="365" y="410" width="270" height="72" rx="5"/>
<text x="500.0" y="438" text-anchor="middle" font-size="14" font-weight="bold">locatedIn: domain unspecified</text>
<text x="500.0" y="462" text-anchor="middle" font-size="12">«constraint note»</text>
<rect class="node dtype" x="695" y="95" width="270" height="72" rx="5"/>
<text x="830.0" y="123" text-anchor="middle" font-size="14" font-weight="bold">Geospatial Position</text>
<text x="830.0" y="147" text-anchor="middle" font-size="12">«Datatype»</text>
<rect class="node dtype" x="695" y="200" width="270" height="72" rx="5"/>
<text x="830.0" y="228" text-anchor="middle" font-size="14" font-weight="bold">Address</text>
<text x="830.0" y="252" text-anchor="middle" font-size="12">«Datatype»</text>
<rect class="node dtype" x="695" y="305" width="270" height="72" rx="5"/>
<text x="830.0" y="333" text-anchor="middle" font-size="14" font-weight="bold">Time Interval</text>
<text x="830.0" y="357" text-anchor="middle" font-size="12">«Datatype»</text>
<rect class="node dtype" x="695" y="410" width="270" height="72" rx="5"/>
<text x="830.0" y="438" text-anchor="middle" font-size="14" font-weight="bold">Reporting Period</text>
<text x="830.0" y="462" text-anchor="middle" font-size="12">«Datatype»</text>
<text x="35" y="585" font-size="12">Legend: stereotype text is semantic; dashed boxes denote notes/datatypes; thick border marks Relator; Event/Situation remain explicitly labeled.</text>
<text x="35" y="608" font-size="12">Protected-distinction lines express only registered inequality constraints. No cardinality/equivalence is implied unless explicitly labeled.</text>
</svg>
