<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 875" role="img" aria-labelledby="title desc">
<title id="title">DGM-ONT-003 V2 Core ontology overview</title>
<desc id="desc">Provide a readable six-module overview of the 32-concept Core and selected explicit cross-domain relation spans.</desc>
