<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 671" role="img" aria-labelledby="title desc">
<title id="title">DGM-ONT-008 Identity and Entity Matching</title>
<desc id="desc">Explain identifier assignment and entity-match assertions without inventing the formally unspecified match/entity endpoints.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="white" stroke="currentColor"/></marker><style>text{font-family:sans-serif}.node{fill:white;stroke:currentColor}.note{fill:white;stroke:currentColor;stroke-dasharray:5 4}.prot{stroke-dasharray:6 5}.dtype{stroke-dasharray:4 3}.relator{stroke-width:2}.edge-label{font-size:10px}</style></defs>
<text x="182.5" y="34" text-anchor="middle" font-size="17" font-weight="bold">Identifier semantics</text>
<text x="532.5" y="34" text-anchor="middle" font-size="17" font-weight="bold">Matching semantics</text>
<text x="882.5" y="34" text-anchor="middle" font-size="17" font-weight="bold">Unspecified endpoints</text>
<line x1="182.5" y1="369.0" x2="182.5" y2="333.0" stroke="currentColor" marker-end="url(#arr)"/>
<text class="edge-label" x="190.5" y="351.0" text-anchor="middle">identifierScheme</text>
<line x1="309.8" y1="369.0" x2="755.2" y2="201.0" stroke="currentColor" marker-end="url(#arr)"/>
<text class="edge-label" x="535.3" y="292.5" text-anchor="middle">identifierEntity</text>
<line x1="532.5" y1="237.0" x2="532.5" y2="201.0" stroke="currentColor" marker-end="url(#inherit)"/>
<line x1="675.0" y1="285.0" x2="740.0" y2="285.0" stroke="currentColor" marker-end="url(#arr)"/>
<text class="edge-label" x="707.5" y="293.0" text-anchor="middle">matchSubject</text>
<line x1="659.8" y1="333.0" x2="755.2" y2="369.0" stroke="currentColor" marker-end="url(#arr)"/>
<text class="edge-label" x="704.7" y="358.5" text-anchor="middle">matchObject</text>
<line x1="532.5" y1="333.0" x2="532.5" y2="369.0" stroke="currentColor" marker-end="url(#arr)"/>
<text class="edge-label" x="524.5" y="351.0" text-anchor="middle">hasMatchConfidence</text>
<rect class="node dtype" x="40" y="105" width="285" height="96" rx="5"/>
<text x="182.5" y="129" text-anchor="middle" font-size="13" font-weight="bold">Identifier Value</text>
<text x="182.5" y="187" text-anchor="middle" font-size="11">«Datatype»</text>
<rect class="node" x="40" y="237" width="285" height="96" rx="5"/>
<text x="182.5" y="261" text-anchor="middle" font-size="13" font-weight="bold">Identifier Scheme</text>
<text x="182.5" y="319" text-anchor="middle" font-size="11">«Kind»</text>
<rect class="node relator" x="40" y="369" width="285" height="96" rx="5"/>
<text x="182.5" y="393" text-anchor="middle" font-size="13" font-weight="bold">Identifier Assignment</text>
<text x="182.5" y="451" text-anchor="middle" font-size="11">«Relator»</text>
<rect class="node" x="390" y="105" width="285" height="96" rx="5"/>
<text x="532.5" y="129" text-anchor="middle" font-size="13" font-weight="bold">Assertion</text>
<text x="532.5" y="187" text-anchor="middle" font-size="11">«Kind»</text>
<rect class="node" x="390" y="237" width="285" height="96" rx="5"/>
<text x="532.5" y="261" text-anchor="middle" font-size="13" font-weight="bold">Entity Match Assertion</text>
<text x="532.5" y="319" text-anchor="middle" font-size="11">«Subkind»</text>
<rect class="node" x="390" y="369" width="285" height="96" rx="5"/>
<text x="532.5" y="393" text-anchor="middle" font-size="13" font-weight="bold">Match Confidence</text>
<text x="532.5" y="451" text-anchor="middle" font-size="11">«Quality»</text>
<rect class="note" x="740" y="105" width="285" height="96" rx="5"/>
<text x="882.5" y="129" text-anchor="middle" font-size="13" font-weight="bold">identifierEntity: range unspecified</text>
<text x="882.5" y="187" text-anchor="middle" font-size="11">«constraint note»</text>
<rect class="note" x="740" y="237" width="285" height="96" rx="5"/>
<text x="882.5" y="261" text-anchor="middle" font-size="13" font-weight="bold">matchSubject: range unspecified</text>
<text x="882.5" y="319" text-anchor="middle" font-size="11">«constraint note»</text>
<rect class="note" x="740" y="369" width="285" height="96" rx="5"/>
<text x="882.5" y="393" text-anchor="middle" font-size="13" font-weight="bold">matchObject: range unspecified</text>
<text x="882.5" y="451" text-anchor="middle" font-size="11">«constraint note»</text>
<text x="40" y="585" font-size="11">Legend: stereotype text carries semantics; dashed boxes are notes/datatypes; thick borders mark Relators; hollow triangle = subClassOf.</text>
<text x="40" y="607" font-size="11">Dashed protected lines mean only registered inequality. No cardinality, equivalence or extra endpoint is implied by layout.</text>
</svg>
