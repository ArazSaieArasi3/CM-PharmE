<g font-family="sans-serif" font-size="14" text-anchor="middle">
<text x="110" y="125">V1 ecosystem</text><text x="110" y="148">conceptual baseline</text>
<text x="310" y="125">Evidence strategy</text><text x="310" y="148">review + data grounding</text>
<text x="510" y="120">Architecture</text><text x="510" y="143">5 domains → modular</text><text x="510" y="166">Core / X-INFRA / Ext.</text>
<text x="710" y="125">Formalization</text><text x="710" y="148">OWL / SHACL depth</text>
<text x="910" y="120">Representation</text><text x="910" y="143">ontology + RDB</text><text x="910" y="166">+ RDF / KG</text>
