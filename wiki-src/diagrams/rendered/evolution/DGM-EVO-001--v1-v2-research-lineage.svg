<rect x="30" y="85" width="190" height="90" rx="8" /><rect x="270" y="85" width="190" height="90" rx="8" /><rect x="510" y="85" width="190" height="90" rx="8" /><rect x="750" y="85" width="190" height="90" rx="8" /><rect x="990" y="85" width="160" height="90" rx="8" />
<line x1="220" y1="130" x2="270" y2="130" marker-end="url(#a)" /><line x1="460" y1="130" x2="510" y2="130" marker-end="url(#a)" /><line x1="700" y1="130" x2="750" y2="130" marker-end="url(#a)" /><line x1="940" y1="130" x2="990" y2="130" marker-end="url(#a)" />
