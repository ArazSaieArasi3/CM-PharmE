name: Pages WebVOWL Candidate

on:
  pull_request:
    paths:
      - "docs/documentation/webvowl-adapter.json"
      - "docs/documentation/pages-272-webvowl.md"
      - "tools/pages/build_webvowl_explorer.py"
      - "tools/pages/test_webvowl_candidate.py"
      - "tools/pages/test_webvowl_v3_contract.py"
      - "tools/pages/build_shell.py"
      - "pages-src/site.css"
      - ".github/workflows/pages-webvowl-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build all registered WebVOWL candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout CM-PharmE publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard future explorer onboarding and route isolation
        run: python tools/pages/test_webvowl_v3_contract.py

      - name: Checkout exact WebVOWL 1.1.7 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VisualDataWeb/WebVOWL
          ref: 28e7dd9540622e8cb723dc000824b5eef5ae775f
          path: external/webvowl

      - name: Checkout exact OWL2VOWL 0.3.7 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VisualDataWeb/OWL2VOWL
          ref: 2833ead00122ca252a0fd0e18c5e5b696d711d2c
          path: external/owl2vowl

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 12 release-build runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "12.22.12"

      - name: Set up Java 8 converter runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "8"

      - name: Install pinned semantic Python dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'rdflib==7.5.0'
          'pyshacl==0.31.0'

      - name: Checkout rebuild and gate all registered semantic inputs
        run: |
          python tools/pages/run_version_pipeline.py checkout
          python tools/pages/run_version_pipeline.py inputs

      - name: Pin historical Maven build plugins
        run: python tools/pages/prepare_converter_build.py external/owl2vowl

      - name: Build exact OWL2VOWL 0.3.7 converter
        shell: bash
        run: |
          set -euo pipefail
          cd external/owl2vowl
          mvn -B -f pom.cmpe.xml package -P standalone-release -DskipTests
          test -s target/OWL2VOWL-0.3.7-shaded.jar
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p=Path("target/OWL2VOWL-0.3.7-shaded.jar")
          h=hashlib.sha256()
          with zipfile.ZipFile(p) as z:
              for name in sorted(x for x in z.namelist() if not x.endswith("/")):
                  h.update(name.encode("utf-8")); h.update(b"\\0"); h.update(z.read(name)); h.update(b"\\n")
          digest=h.hexdigest()
          print("OWL2VOWL_CONTENT_SHA256="+digest)
          expected="f500951cdd4a0963fb80a96b974f463e8cfc84660f3b46ce802b14296e5e9aee"
          if digest != expected:
              raise SystemExit(f"OWL2VOWL content drift: {digest} != {expected}")
          PY

      - name: Convert all enabled governed inputs
        run: python tools/pages/run_version_pipeline.py convert

      - name: Build exact WebVOWL 1.1.7 frontend
        shell: bash
        run: |
          set -euo pipefail
          cd external/webvowl
          node --version
          npm --version
          npm install --ignore-scripts
          npm run release
          test -s deploy/index.html
          test -s deploy/js/webvowl.js
          test -s deploy/js/webvowl.app.js

      - name: Package all enabled explorers
        run: python tools/pages/run_version_pipeline.py explorers

      - name: Build Pages shell around explorers
        run: python tools/pages/build_shell.py --output build/site

      - name: Audit version isolation, context and static assets
        run: >-
          python tools/pages/test_webvowl_candidate.py
          --site build/site
          --output build/evidence/pages-272-webvowl-static-qa.json

      - name: Show explorer manifests
        run: |
          cat build/site/ontology/v1.0.0/explore/explorer-manifest.json
          cat build/site/ontology/v2/current/explore/explorer-manifest.json
          cat build/evidence/pages-272-webvowl-static-qa.json

      - name: Upload WebVOWL candidate
        uses: actions/upload-artifact@v4
        with:
          name: cm-pharme-webvowl-candidate
          path: |
            build/site/
            build/evidence/
            build/vowl/
          if-no-files-found: error
