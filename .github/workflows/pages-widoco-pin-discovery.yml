name: WIDOCO Tool Pin Discovery

on:
  push:
    branches:
      - pages/271-widoco-reference
    paths:
      - ".github/workflows/pages-widoco-pin-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksum:
    name: Resolve pinned WIDOCO JAR checksum
    runs-on: ubuntu-latest
    steps:
      - name: Download exact WIDOCO release asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error             "https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-17.jar"             --output widoco.jar
          sha256sum widoco.jar
          java -jar widoco.jar --version || true
