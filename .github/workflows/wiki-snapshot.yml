name: Wiki Snapshot

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Wiki baseline identifier
        required: true
        default: WB-2026.10.1
  pull_request:
    paths:
      - 'wiki-src/**'
      - 'tools/wiki/build_wiki_snapshot.py'
      - '.github/workflows/wiki-snapshot.yml'

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve baseline
        id: baseline
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline }}
        run: |
          python - <<'RESOLVE'
          import json, os
          requested=os.environ.get('REQUESTED_BASELINE','').strip()
          value=requested or json.load(open('wiki-src/baseline-manifest.json'))['candidate_baseline_id']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('value='+value+'\n')
          RESOLVE
      - name: Build deterministic Wiki snapshot
        run: python tools/wiki/build_wiki_snapshot.py build --baseline "${{ steps.baseline.outputs.value }}"
      - name: Verify snapshot read-back
        run: python tools/wiki/build_wiki_snapshot.py verify --archive "dist/wiki-${{ steps.baseline.outputs.value }}.zip"
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-${{ steps.baseline.outputs.value }}
          path: |
            dist/wiki-${{ steps.baseline.outputs.value }}.zip
            dist/wiki-${{ steps.baseline.outputs.value }}/ARCHIVE-MANIFEST.json
          if-no-files-found: error
          retention-days: 30
