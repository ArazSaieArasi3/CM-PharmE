name: CM-PharmE 2.0 W7-E8 Held-out Generalizability

on:
  pull_request:
    paths:
      - 'v2/evaluation/heldout/**'
      - 'v2/evaluation/protocol/e8-*'
      - 'v2/evaluation/results/e8-*'
      - 'v2/ontology/**'
      - 'tools/v2_evaluation/e8_heldout_generalizability.py'
      - 'tools/v2_ontology/**'
      - '.github/workflows/v2-w7-e8-heldout-generalizability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w7-e8-heldout-generalizability:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned semantic dependencies
        run: python -m pip install --disable-pip-version-check 'rdflib==7.5.0' 'pyshacl==0.31.0' 'PyYAML==6.0.2'
      - name: Rebuild and verify frozen ontology baseline
        run: python tools/v2_ontology/build_validate.py --output-root build/w7-e8/asserted --require-shacl
      - name: Execute held-out first-pass generalizability evaluation
        run: >-
          python tools/v2_evaluation/e8_heldout_generalizability.py
          --requirements v2/evaluation/protocol/e8-heldout-requirements.csv
          --mapping v2/evaluation/results/e8-heldout-first-pass-mapping.csv
          --cqs v2/evaluation/protocol/e8-heldout-cqs.csv
          --cq-results v2/evaluation/results/e8-heldout-cq-results.csv
          --ontology-modules v2/ontology/source/modules
          --output build/w7-e8/e8-generalizability.json
          --summary build/w7-e8/e8-generalizability.md
      - name: Record W7-E8 summary
        if: always()
        run: |
          if [ -f build/w7-e8/e8-generalizability.md ]; then
            cat build/w7-e8/e8-generalizability.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'W7-E8 summary unavailable because execution failed before report creation.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload W7-E8 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-w7-e8-heldout-evidence
          path: |
            v2/evaluation/heldout/e8-heldout-source-manifest.json
            v2/evaluation/protocol/e8-heldout-requirements.csv
            v2/evaluation/protocol/e8-heldout-cqs.csv
            v2/evaluation/results/e8-heldout-first-pass-mapping.csv
            v2/evaluation/results/e8-heldout-cq-results.csv
            build/w7-e8/e8-generalizability.json
            build/w7-e8/e8-generalizability.md
          if-no-files-found: warn
          retention-days: 30
