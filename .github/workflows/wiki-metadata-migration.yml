name: Wiki Metadata Migration

on:
  push:
    branches:
      - wiki/progressive-metadata-2026-09
    paths:
      - 'tools/wiki/migrate_progressive_metadata.py'
      - '.github/workflows/wiki-metadata-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-pharme-wiki-metadata-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate reader-facing metadata
        run: python tools/wiki/migrate_progressive_metadata.py
      - name: Validate metadata contract
        run: python tools/wiki/check_metadata_contract.py
      - name: Validate Wiki source
        run: python tools/wiki/validate_wiki_source.py
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki-src/pages wiki-src/quality/metadata-migration-report.json
          if git diff --cached --quiet; then
            echo "No metadata migration changes to commit."
            exit 0
          fi
          git commit -m "Wiki metadata: migrate reader-facing pages to progressive disclosure"
          git push origin HEAD:wiki/progressive-metadata-2026-09
