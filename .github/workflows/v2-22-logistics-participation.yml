name: CM-PharmE 2.2 Logistics Participation Candidate
on:
  pull_request:
    branches: [v2/research-program]
    paths:
      - 'v2/release/2.2/logistics-participation/**'
      - '.github/workflows/v2-22-logistics-participation.yml'
  push:
    branches: ['v2/**']
    paths:
      - 'v2/release/2.2/logistics-participation/**'
      - '.github/workflows/v2-22-logistics-participation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install bounded validator and reasoner
        run: python -m pip install rdflib==7.5.0 pyshacl==0.31.0 owlrl==7.1.4 jsonschema==4.25.1 owlready2==0.48
      - name: Rebuild exact native/formal/mapping review candidate
        run: >-
          python v2/release/2.2/logistics-participation/0.1.0/build.py
          --output build/logistics-participation --check-committed
      - name: Replay independently frozen boundary oracles
        run: >-
          python v2/review/logistics-site/0.1.0/verify.py
          --output build/logistics-site-replay --check-committed
      - name: Bounded OWL 2 DL consistency with HermiT
        run: >-
          python v2/release/2.2/logistics-participation/0.1.0/hermit.py
          > build/logistics-participation/hermit.json
      - name: Record exact execution identity
        env:
          EXECUTION_SHA: ${{ github.sha }}
          EXECUTION_RUN: ${{ github.run_id }}
          EXECUTION_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json,os,platform,pathlib
          pathlib.Path('build/logistics-participation/execution.json').write_text(
              json.dumps({k:os.environ[k] for k in ['EXECUTION_SHA','EXECUTION_RUN','EXECUTION_REF']}
                         | {'python':platform.python_version()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cm-pharme-logistics-participation
          path: |
            build/logistics-participation/
            build/logistics-site-replay/
          if-no-files-found: error
