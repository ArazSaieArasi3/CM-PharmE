name: CM-PharmE 2.2 Reconciliation Assembly
on:
  pull_request:
    branches: [v2/research-program]
    paths:
      - 'v2/release/2.2/assembly/**'
      - 'v2/release/2.2/preparation/0.1.0/audit.py'
      - '.github/workflows/v2-22-reconciliation-assembly.yml'
  push:
    branches: ['v2/**']
    paths:
      - 'v2/release/2.2/assembly/**'
      - 'v2/release/2.2/preparation/0.1.0/audit.py'
      - '.github/workflows/v2-22-reconciliation-assembly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned serialization dependencies
        run: python -m pip install --disable-pip-version-check rdflib==7.5.0 jsonschema==4.26.0
      - name: Build and verify the provisional review assembly
        run: >-
          python v2/release/2.2/assembly/0.1.0/build.py
          --output build/comprehensive-22-assembly --check-committed
      - name: Record execution identity
        env:
          EXECUTION_SHA: ${{ github.sha }}
          EXECUTION_REF: ${{ github.ref }}
          EXECUTION_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib, platform
          import importlib.metadata
          record = {k: os.environ[k] for k in ['EXECUTION_SHA', 'EXECUTION_REF', 'EXECUTION_RUN']}
          record.update(python=platform.python_version(), rdflib=importlib.metadata.version('rdflib'), jsonschema=importlib.metadata.version('jsonschema'))
          pathlib.Path('build/comprehensive-22-assembly/execution.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Upload exact assembly evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-comprehensive-22-assembly
          path: build/comprehensive-22-assembly/
          if-no-files-found: error
          retention-days: 30
