name: CM-PharmE 2.1 RDB-M4 Supply Capacity

on:
  pull_request:
    branches:
      - v2/research-program
    paths:
      - 'v2/data/migrations/2.1/0.5.0/**'
      - '.github/workflows/v2-21-rdb-m4.yml'
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2/data/migrations/2.1/0.5.0/**'
      - '.github/workflows/v2-21-rdb-m4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copied-w6-supply-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmpe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmpe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmpe
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned representation and reasoning dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'psycopg[binary]==3.2.9' 'rdflib==7.5.0' 'pyshacl==0.31.0'
          'owlrl==7.1.4' 'owlready2==0.49'
      - name: Bootstrap isolated W6 copy
        run: python tools/v2_data/bootstrap_ingest.py --reset --report build/v2-21-rdb-m4/ingest.json
      - name: Execute M4 typed bearer, observation, source, SQL/RDF, SHACL/OWL and rollback checks
        run: python v2/data/migrations/2.1/0.5.0/verify_m4.py
      - name: Expose exact bounded evidence
        if: always()
        run: |
          if test -f build/v2-21-rdb-m4/report.json; then
            cat build/v2-21-rdb-m4/report.json
          fi
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-21-rdb-m4-evidence
          path: build/v2-21-rdb-m4/
          if-no-files-found: warn
          retention-days: 30
