# SPDX-License-Identifier: MIT
name: CM-PharmE 2.1 Curated Core Package Replay
on:
  push:
    branches: ['v2/**']
    paths: ['v2/release/2.1/bundle/0.1.0/**', '.github/workflows/v2-21-ga-core-bundle.yml']
  pull_request:
    branches: [v2/research-program]
    paths: ['v2/release/2.1/bundle/0.1.0/**', '.github/workflows/v2-21-ga-core-bundle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curated-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmpe_m1_core_332
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cmpe_m1_core_332"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CMPE_FIXTURE_URL: postgresql://postgres:postgres@localhost:5432/cmpe_m1_core_332
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install external declared replay dependencies
        run: |
          python -m pip install -r v2/ontology/profiles/2.1/m1-provenance/0.1.0/requirements-verify.txt
          python -m pip install -r v2/data/integrations/2.1/m1-core/0.1.0/requirements.txt
      - name: Record exact package execution identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path('build/ga-core');out.mkdir(parents=True,exist_ok=True)
          keys=['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_EVENT_NAME','GITHUB_RUN_ATTEMPT']
          (out/'execution.json').write_text(json.dumps({x:os.environ[x] for x in keys},indent=2)+'\n')
          PY
      - name: Build two deterministic archives from the frozen contract
        run: |
          python v2/release/2.1/bundle/0.1.0/build_archive.py --root . --output-dir build/ga-core/build
          python v2/release/2.1/bundle/0.1.0/build_archive.py --root . --output-dir build/ga-core/second-build
          cmp build/ga-core/build/cm-pharme-2.1.0.tar build/ga-core/second-build/cm-pharme-2.1.0.tar
      - name: Replay exact extracted package and guarded copied fixture
        run: >-
          python v2/release/2.1/bundle/0.1.0/verify_archive.py
          --archive build/ga-core/build/cm-pharme-2.1.0.tar
          --output-dir build/ga-core/replay --self-test
          --database-url "$CMPE_FIXTURE_URL"
      - name: Upload package and exact bounded replay evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-21-curated-core-package
          path: build/ga-core/
          if-no-files-found: warn
          retention-days: 30
