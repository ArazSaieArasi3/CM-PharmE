name: CM-PharmE 2.1 RDB-M2 Facility Operation

on:
  pull_request:
    branches:
      - v2/research-program
    paths:
      - 'v2/data/migrations/2.1/0.3.0/**'
      - '.github/workflows/v2-21-rdb-m2.yml'
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2/data/migrations/2.1/0.3.0/**'
      - '.github/workflows/v2-21-rdb-m2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copied-w6-facility-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmpe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmpe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmpe
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned representation and reasoning dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'psycopg[binary]==3.2.9' 'rdflib==7.5.0' 'pyshacl==0.31.0'
          'owlrl==7.1.4' 'owlready2==0.49'
      - name: Bootstrap isolated W6 copy
        run: python tools/v2_data/bootstrap_ingest.py --reset --report build/v2-21-rdb-m2/ingest.json
      - name: Execute M2 relational, RDF, SHACL, OWL and rollback evidence
        run: python v2/data/migrations/2.1/0.3.0/verify_m2.py
      - name: Summarize bounded M2 report
        if: always()
        run: |
          if test -f build/v2-21-rdb-m2/report.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/v2-21-rdb-m2/report.json').read_text())
          s={'passed':r['passed'],'q21_02':r['q21_02']['rows'],
             'sql_sha256':r['q21_02']['sql_normalized_sha256'],
             'rdf_sha256':r['graph_sha256'], 'rollback_sha256':r['database_after_sha256']}
          print(json.dumps(s,indent=2))
          PY
          fi
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-21-rdb-m2-evidence
          path: build/v2-21-rdb-m2/
          if-no-files-found: warn
          retention-days: 30
