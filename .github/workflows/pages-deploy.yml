name: Pages Deployment Candidate

on:
  pull_request:
    paths:
      - "ontology/source/**"
      - "ontology/validation/**"
      - "tools/ontology/**"
      - "docs/documentation/**"
      - "pages-src/**"
      - "tools/pages/**"
      - ".github/workflows/pages-*.yml"
      - "CHANGELOG.md"
  push:
    branches:
      - main
    paths:
      - "ontology/source/**"
      - "ontology/validation/**"
      - "tools/ontology/**"
      - "docs/documentation/**"
      - "pages-src/**"
      - "tools/pages/**"
      - ".github/workflows/pages-*.yml"
      - "CHANGELOG.md"
  workflow_run:
    workflows:
      - "CM-PharmE 2.0 Formal Ontology CI"
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy:
        description: "Attempt public GitHub Pages deployment after all build/preflight gates"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "cm-pharme-pages-${{ github.event_name }}-${{ github.ref || github.event.workflow_run.head_branch }}"
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Pages build request
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.classify.outputs.should_build }}
      v2_trigger_sha: ${{ steps.classify.outputs.v2_trigger_sha }}
      stale_v2_registry: ${{ steps.classify.outputs.stale_v2_registry }}
      public_enabled: ${{ steps.classify.outputs.public_enabled }}
    steps:
      - name: Checkout publication control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source-controlled trigger policy
        run: python tools/pages/test_pages_trigger_policy.py

      - name: Classify event
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "v2_trigger_sha=" >> "$GITHUB_OUTPUT"
          echo "stale_v2_registry=false" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print('public_enabled='+str(json.loads(Path('docs/documentation/pages-deployment-policy.json').read_text())['public_deploy_enabled']).lower())
          PY

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "${{ github.event.workflow_run.head_branch }}" in
              v2/*) ;;
              *) echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            triggered="${{ github.event.workflow_run.head_sha }}"
            registered="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/documentation/ontology-version-registry.json").read_text())
          v=next(x for x in d["versions"] if x["id"]=="v2")
          print(v["semantic_source_ref"].rsplit("@",1)[1])
          PY
          )"
            echo "v2_trigger_sha=$triggered" >> "$GITHUB_OUTPUT"
            if [ "$triggered" != "$registered" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "stale_v2_registry=true" >> "$GITHUB_OUTPUT"
              echo "V2 semantic CI passed at $triggered, but Pages registry is pinned to $registered. Waiting for governed registry update on main." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  build:
    name: Build deploy-ready Pages artifact
    needs: classify
    if: needs.classify.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify frozen documentation baseline archive
        run: python tools/pages/verify_baseline_archive.py

      - name: Validate common version plan and checkout exact semantic sources
        run: python tools/pages/run_version_pipeline.py checkout --output build/evidence/version-pipeline-plan.json

      - name: Checkout exact WebVOWL 1.1.7 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VisualDataWeb/WebVOWL
          ref: 28e7dd9540622e8cb723dc000824b5eef5ae775f
          path: external/webvowl

      - name: Checkout exact OWL2VOWL 0.3.7 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VisualDataWeb/OWL2VOWL
          ref: 2833ead00122ca252a0fd0e18c5e5b696d711d2c
          path: external/owl2vowl

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 12 release-build runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "12.22.12"

      - name: Install pinned semantic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'rdflib==7.5.0'
          'pyshacl==0.31.0' 'jsonschema==4.25.1'

      - name: Download and verify pinned WIDOCO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --silent --show-error             "https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-17.jar"             --output build/tools/widoco.jar
          echo "be57a270fffb91e55810fa308717e704a44e2e7c027a3d68125a49da6c8b4e2b  build/tools/widoco.jar" | sha256sum --check --strict

      - name: Rebuild and gate all registered semantic inputs
        run: python tools/pages/run_version_pipeline.py inputs

      - name: Generate and audit all enabled formal references
        run: python tools/pages/run_version_pipeline.py references

      - name: Package governed version downloads
        run: python tools/pages/run_version_pipeline.py downloads

      - name: Set up Java 8 converter runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "8"

      - name: Build and verify exact OWL2VOWL converter
        shell: bash
        run: |
          set -euo pipefail
          (cd external/owl2vowl && mvn -B package -P standalone-release -DskipTests)
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p=Path('external/owl2vowl/target/OWL2VOWL-0.3.7-shaded.jar')
          h=hashlib.sha256()
          with zipfile.ZipFile(p) as z:
              for name in sorted(x for x in z.namelist() if not x.endswith('/')):
                  h.update(name.encode()); h.update(b'\\0'); h.update(z.read(name)); h.update(b'\\n')
          assert h.hexdigest() == 'f500951cdd4a0963fb80a96b974f463e8cfc84660f3b46ce802b14296e5e9aee', 'OWL2VOWL content drift'
          PY

      - name: Convert all enabled governed inputs
        run: python tools/pages/run_version_pipeline.py convert

      - name: Build exact WebVOWL frontend
        shell: bash
        run: |
          set -euo pipefail
          (cd external/webvowl && npm install --ignore-scripts && npm run release)

      - name: Package all enabled governed explorers
        run: |
          python tools/pages/test_webvowl_v3_contract.py
          python tools/pages/run_version_pipeline.py explorers

      - name: Build multi-version shell around governed artifacts
        run: python tools/pages/build_shell.py --output build/site

      - name: Audit assembled WebVOWL explorers
        run: >-
          python tools/pages/test_webvowl_candidate.py
          --site build/site
          --output build/evidence/pages-272-webvowl-static-qa.json

      - name: Expose enabled generated references as directory entry points
        run: |
          python tools/pages/run_version_pipeline.py aliases
          touch build/site/.nojekyll

      - name: Audit final closed-loop cross-surface navigation
        run: python tools/pages/test_cross_surface_navigation.py

      - name: Audit retained Wiki reference dispositions
        run: python tools/pages/audit_wiki_disposition.py

      - name: Run download/traceability audits on assembled site
        shell: bash
        run: |
          set -euo pipefail
          python tools/pages/test_download_integration.py --site build/site
          python tools/pages/audit_download_closure.py             --site build/site             --output build/evidence/pages-273-final-audit.json

      - name: Prove future-version isolation on assembled artifacts
        run: python tools/pages/test_future_version_onboarding.py --site build/site --output build/evidence/pages-277-onboarding.json

      - name: Deployment preflight
        env:
          V2_TRIGGER_SHA: ${{ needs.classify.outputs.v2_trigger_sha }}
        run: >-
          python tools/pages/preflight_deployment.py
          --site build/site
          --output build/site/pages-deployment-manifest.json
          --build-sha "${{ github.sha }}"
          --event-name "${{ github.event_name }}"
          --v2-trigger-sha "$V2_TRIGGER_SHA"

      - name: Upload deploy-ready Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          include-hidden-files: true

      - name: Preserve build and release audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: cm-pharme-pages-build-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy approved Pages artifact
    needs:
      - classify
      - build
    if: >-
      needs.classify.outputs.public_enabled == 'true' &&
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true ||
       github.event_name == 'push') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout deployment policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce source-controlled deployment authorization
        shell: bash
        run: |
          enabled="$(python - <<'PY'
          import json
          from pathlib import Path
          print(str(json.loads(Path("docs/documentation/pages-deployment-policy.json").read_text())["public_deploy_enabled"]).lower())
          PY
          )"
          test "$enabled" = "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-public:
    name: Verify rendered public Pages and WebVOWL
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout verification contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned browser tooling
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Verify public V1/V2 routes and interactions
        run: >-
          python tools/pages/verify_public_pages.py
          --base-url https://arazsaiearasi3.github.io/CM-PharmE/
          --output public-verification.json

      - name: Prove verifier rejects an intentionally invalid public surface
        run: python tools/pages/test_public_verification_failure_contract.py

      - name: Verify published Wiki and Pages reader journeys
        run: python tools/pages/verify_cross_surface_public.py --output public-navigation.json

      - name: Preserve rendered verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-pharme-public-verification
          path: |
            public-verification.json
            public-v1-explore.png
            public-v2-explore.png
            public-navigation.json
          if-no-files-found: warn
