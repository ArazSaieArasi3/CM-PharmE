name: CM-PharmE 2.0 W7-E1 Structural Quality

on:
  pull_request:
    branches:
      - v2/research-program
    paths:
      - 'v2/ontology/**'
      - 'v2/ontouml/**'
      - 'v2/data/mappings/**'
      - 'v2/evaluation/protocol/**'
      - 'v2/research/w7/**'
      - 'tools/v2_ontology/**'
      - 'tools/v2_evaluation/**'
      - '.github/workflows/v2-w7-structural-ci.yml'
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2/ontology/**'
      - 'v2/ontouml/**'
      - 'v2/data/mappings/**'
      - 'v2/evaluation/protocol/**'
      - 'v2/research/w7/**'
      - 'tools/v2_ontology/**'
      - 'tools/v2_evaluation/**'
      - '.github/workflows/v2-w7-structural-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w7-e1-structural-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned semantic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'rdflib==7.5.0'
          'pyshacl==0.31.0'

      - name: Rebuild frozen formal baseline
        run: >-
          python tools/v2_ontology/build_validate.py
          --output-root build/w7-e1/formal
          --require-shacl

      - name: Execute W7-E1 structural quality evaluation
        run: >-
          python tools/v2_evaluation/structural_quality.py
          --output build/w7-e1/structural-quality.json

      - name: Verify E1 report state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/w7-e1/structural-quality.json')
          r = json.loads(p.read_text())
          if not r.get('passed'):
              raise SystemExit('W7-E1 report is not PASS')
          mandatory = r.get('mandatory_checks', {})
          failed = [k for k, v in mandatory.items() if not v]
          if failed:
              raise SystemExit('Failed mandatory checks: ' + ', '.join(failed))
          print('W7-E1 PASS')
          PY

      - name: Record W7-E1 summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/w7-e1/structural-quality.json')
          r = json.loads(p.read_text()) if p.exists() else {}
          with open('w7-e1-summary.md','w') as f:
              f.write('## CM-PharmE 2.0 W7-E1 Structural Quality\n\n')
              f.write(f"- Overall: **{'PASS' if r.get('passed') else 'NOT PASS'}**\n")
              f.write(f"- Canonical graph SHA-256: `{r.get('canonical_graph_sha256','unavailable')}`\n")
              f.write(f"- Counts: `{json.dumps(r.get('counts',{}), sort_keys=True)}`\n")
              m = r.get('ontology_rdb_mapping_resolution',{})
              f.write(f"- Ontology↔RDB mapping IRI resolution: {m.get('resolved_rows','?')}/{m.get('registered_rows','?')}\n")
              c = r.get('conceptual_registry',{})
              f.write(f"- Conceptual registry resolution: {c.get('resolved','?')}/{c.get('expected','?')}\n")
              f.write('- Boundary: structural quality does not establish domain completeness or empirical correctness.\n')
          PY
          cat w7-e1-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload W7-E1 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-w7-e1-structural-evidence
          path: |
            build/w7-e1/
            w7-e1-summary.md
          if-no-files-found: warn
          retention-days: 30
