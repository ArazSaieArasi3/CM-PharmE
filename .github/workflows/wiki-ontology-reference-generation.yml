name: Wiki Ontology Reference Generation

on:
  push:
    branches:
      - wiki/ontology-reference-2026-09
    paths:
      - 'tools/wiki/generate_ontology_reference.py'
      - '.github/workflows/wiki-ontology-reference-generation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-pharme-wiki-ontology-reference-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Checkout V2 authority
        uses: actions/checkout@v4
        with:
          ref: v2/research-program
          path: _v2_authority
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exhaustive ontology reference
        run: |
          python tools/wiki/generate_ontology_reference.py \
            --authority-root _v2_authority \
            --authority-ref v2/research-program@1226b0a5484f8f5d3a8d214e0d0f52f066b88999
      - name: Validate Wiki source
        run: python tools/wiki/validate_wiki_source.py
      - name: Validate navigation
        run: python tools/wiki/check_navigation.py --output wiki-navigation-report.json
      - name: Validate progressive metadata
        run: python tools/wiki/check_metadata_contract.py
      - name: Validate documentation profiles
        run: python tools/wiki/check_documentation_profiles.py
      - name: Validate diagram artifacts
        run: python tools/wiki/check_diagrams.py
      - name: Commit generated ontology reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki-src/pages wiki-src/page-inventory.csv wiki-src/ontology-reference
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Wiki ontology reference: generate exhaustive V2 reference"
          git push origin HEAD:wiki/ontology-reference-2026-09
