name: Publish CM-PharmE Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki-src/**'
      - 'tools/wiki/stage_wiki_publish.py'
      - 'tools/wiki/verify_published_wiki.py'
      - 'tools/wiki/build_wiki_snapshot.py'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cm-pharme-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source-controlled Wiki
        run: |
          python tools/wiki/validate_wiki_source.py
          python tools/wiki/validate_wiki_source.py --self-test

      - name: Read baseline state
        id: baseline
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("wiki-src/baseline-manifest.json", encoding="utf-8"))
          print("id=" + str(x.get("candidate_baseline_id","")))
          print("declared=" + ("true" if x.get("declared") else "false"))
          PY

      - name: Configure ephemeral Git credentials
        shell: bash
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"

      - name: Clone GitHub Wiki repository
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" _published_wiki

      - name: Stage source-complete pages
        run: |
          python tools/wiki/stage_wiki_publish.py \
            --source-root wiki-src \
            --wiki-dir _published_wiki \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA"

      - name: Commit and push Wiki
        id: push
        shell: bash
        run: |
          set -euo pipefail
          cd _published_wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Wiki content changes to commit."
          else
            git commit -m "Sync CM-PharmE Wiki from ${GITHUB_SHA}"
            git push origin HEAD
          fi
          WIKI_SHA="$(git rev-parse HEAD)"
          echo "wiki_sha=$WIKI_SHA" >> "$GITHUB_OUTPUT"
          echo "Wiki commit: $WIKI_SHA"

      - name: Verify rendered Wiki pages
        run: |
          python tools/wiki/verify_published_wiki.py \
            --source-root wiki-src \
            --repository "$GITHUB_REPOSITORY" \
            --wiki-commit "${{ steps.push.outputs.wiki_sha }}" \
            --report wiki-publish-verification.json

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: wiki-publish-verification
          path: |
            wiki-publish-verification.json
            _published_wiki/.cm-pharme-managed-pages.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Build declared-baseline archive
        if: steps.baseline.outputs.declared == 'true'
        run: |
          python tools/wiki/build_wiki_snapshot.py build \
            --baseline "${{ steps.baseline.outputs.id }}" \
            --wiki-commit "${{ steps.push.outputs.wiki_sha }}"
          python tools/wiki/build_wiki_snapshot.py verify \
            --archive "dist/wiki-${{ steps.baseline.outputs.id }}.zip" \
            --wiki-commit "${{ steps.push.outputs.wiki_sha }}"
          sha256sum "dist/wiki-${{ steps.baseline.outputs.id }}.zip" | tee final-wiki-archive-sha256.txt

      - name: Upload declared-baseline archive
        if: steps.baseline.outputs.declared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wiki-${{ steps.baseline.outputs.id }}-final
          path: |
            dist/wiki-${{ steps.baseline.outputs.id }}.zip
            dist/wiki-${{ steps.baseline.outputs.id }}/ARCHIVE-MANIFEST.json
            final-wiki-archive-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Finalize QA issue
        if: steps.baseline.outputs.declared == 'true'
        shell: bash
        run: |
          BODY=$(cat <<EOF
          Final combined Wiki QA passed for ${{ steps.baseline.outputs.id }}.

          - Source repository commit: $GITHUB_SHA
          - Published Wiki commit: ${{ steps.push.outputs.wiki_sha }}
          - Source validation: PASS
          - Rendered verification: PASS
          - Final archive build/read-back: PASS
          - V2 status remains Stable-to-date / Evolving.
          - Final QA report: wiki-src/qa/WB-2026.09.1-final-qa.md
          - Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Unresolved documentation-critical blockers: 0.
          EOF
          )
          gh issue comment 209 --repo "$GITHUB_REPOSITORY" --body "$BODY"
          gh issue close 209 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Finalize archive issue
        if: steps.baseline.outputs.declared == 'true'
        shell: bash
        run: |
          ARCHIVE_SHA="$(cut -d' ' -f1 final-wiki-archive-sha256.txt)"
          BODY=$(cat <<EOF
          Final reproducible Wiki archive completed for ${{ steps.baseline.outputs.id }}.

          - Source repository commit: $GITHUB_SHA
          - Exact published Wiki commit: ${{ steps.push.outputs.wiki_sha }}
          - Archive SHA-256: $ARCHIVE_SHA
          - Archive read-back verification: PASS
          - Workflow/artifact evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The archive records the exact source repository commit and exact published Wiki commit. This is a documentation snapshot, not a CM-PharmE semantic/model release or GitHub Release.
          EOF
          )
          gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$BODY"
          gh issue close 217 --repo "$GITHUB_REPOSITORY" --reason completed
