name: CM-PharmE 2.0 W7-E10 Representation Consistency

on:
  pull_request:
    branches:
      - v2/research-program
    paths:
      - 'v2/data/**'
      - 'v2/ontology/**'
      - 'tools/v2_data/**'
      - 'tools/v2_evaluation/e10_representation_consistency.py'
      - '.github/workflows/v2-w7-e10-semantic-consistency.yml'
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2/data/**'
      - 'v2/ontology/**'
      - 'tools/v2_data/**'
      - 'tools/v2_evaluation/e10_representation_consistency.py'
      - '.github/workflows/v2-w7-e10-semantic-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w7-e10-semantic-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmpe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmpe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmpe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned representation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'psycopg[binary]==3.2.9'
          'rdflib==7.5.0'
          'pyshacl==0.31.0'
          'PyYAML==6.0.2'

      - name: Verify frozen W5 ontology baseline
        run: >-
          python tools/v2_ontology/build_validate.py
          --output-root build/w7-e10/ontology
          --require-shacl

      - name: Bootstrap reference PostgreSQL/PostGIS realization
        run: >-
          python tools/v2_data/bootstrap_ingest.py
          --reset
          --report build/w7-e10/ingest-report.json

      - name: Generate deterministic reference RDF/KG
        run: >-
          python tools/v2_data/export_kg.py
          --output build/w7-e10/cm-pharme-v2-fixture-kg.ttl
          --manifest build/w7-e10/kg-manifest.json

      - name: Re-run frozen paired SQL↔SPARQL benchmarks
        run: >-
          python tools/v2_data/compare_sql_sparql.py
          --kg build/w7-e10/cm-pharme-v2-fixture-kg.ttl
          --report build/w7-e10/sql-sparql-equivalence.json

      - name: Evaluate ontology↔RDB↔KG semantic consistency
        run: >-
          python tools/v2_evaluation/e10_representation_consistency.py
          --kg build/w7-e10/cm-pharme-v2-fixture-kg.ttl
          --sql-sparql-report build/w7-e10/sql-sparql-equivalence.json
          --output build/w7-e10/e10-semantic-consistency.json
          --summary build/w7-e10/e10-semantic-consistency.md

      - name: Record E10 summary
        if: always()
        shell: bash
        run: |
          if [ -f build/w7-e10/e10-semantic-consistency.md ]; then
            cat build/w7-e10/e10-semantic-consistency.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'W7-E10 report unavailable because execution failed before summary creation.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload W7-E10 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-w7-e10-semantic-consistency-evidence
          path: |
            build/w7-e10/ingest-report.json
            build/w7-e10/kg-manifest.json
            build/w7-e10/sql-sparql-equivalence.json
            build/w7-e10/e10-semantic-consistency.json
            build/w7-e10/e10-semantic-consistency.md
            build/w7-e10/cm-pharme-v2-fixture-kg.ttl
            build/w7-e10/cm-pharme-v2-fixture-kg.nt
          if-no-files-found: warn
          retention-days: 30
