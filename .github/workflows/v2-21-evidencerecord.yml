name: CM-PharmE 2.1 EvidenceRecord Projection
on:
  pull_request:
    branches: [v2/research-program]
    paths:
      - 'v2/ontology/candidates/2.1.0-alpha.1-evidencerecord-projection/**'
      - '.github/workflows/v2-21-evidencerecord.yml'
  push:
    branches: ['v2/**']
    paths:
      - 'v2/ontology/candidates/2.1.0-alpha.1-evidencerecord-projection/**'
      - '.github/workflows/v2-21-evidencerecord.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidencerecord-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned semantic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          rdflib==7.5.0 pyshacl==0.31.0 owlrl==7.1.4 owlready2==0.49
      - name: Install locked native dependencies
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --prefix v2/ontology/candidates/2.1.0-alpha.1-evidencerecord-projection/runtime
      - name: Verify the bounded candidate and all historical expectations
        run: >-
          python v2/ontology/candidates/2.1.0-alpha.1-evidencerecord-projection/verify_slice.py
          --node-modules v2/ontology/candidates/2.1.0-alpha.1-evidencerecord-projection/runtime/node_modules
      - name: Expose exact evidence
        if: always()
        run: |
          if test -f build/evidencerecord-projection/report.json; then
            cat build/evidencerecord-projection/report.json
          fi
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-21-evidencerecord-evidence
          path: build/evidencerecord-projection/
          if-no-files-found: warn
          retention-days: 30
