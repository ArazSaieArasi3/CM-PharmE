name: Wiki Documentation CI

on:
  pull_request:
    paths:
      - 'wiki-src/**'
      - 'tools/wiki/**'
      - '.github/workflows/wiki-docs-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'wiki-src/**'
      - 'tools/wiki/**'
      - '.github/workflows/wiki-docs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wiki-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout V2 ontology authority
        uses: actions/checkout@v4
        with:
          ref: v2/research-program
          path: _v2_authority
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current Wiki source
        run: python tools/wiki/validate_wiki_source.py
      - name: Prove invalid documentation is rejected
        run: python tools/wiki/validate_wiki_source.py --self-test
      - name: Check reader-facing terminology
        run: python tools/wiki/check_reader_vocabulary.py
      - name: Validate navigation depth and orphan pages
        run: python tools/wiki/check_navigation.py --output wiki-navigation-report.json
      - name: Validate progressive metadata contract
        run: python tools/wiki/check_metadata_contract.py
      - name: Validate documentation profile separation
        run: python tools/wiki/check_documentation_profiles.py
      - name: Validate diagram artifacts
        run: python tools/wiki/check_diagrams.py
      - name: Validate V2 ontology diagram suite
        run: python tools/wiki/check_v2_ontology_diagram_suite.py
      - name: Revalidate V2 ontology diagrams against authority
        run: |
          python tools/wiki/generate_v2_ontology_diagrams.py --authority-root _v2_authority
          git diff --exit-code -- wiki-src/diagrams wiki-src/ontology-reference/ontology-diagram-coverage.csv wiki-src/ontology-reference/ontology-diagram-coverage.json wiki-src/ontology-reference/ontology-diagram-semantic-review.md wiki-src/pages/V2-Module-*.md
      - name: Validate ontology reference coverage
        run: python tools/wiki/check_ontology_reference.py
      - name: Upload navigation report
        uses: actions/upload-artifact@v4
        with:
          name: wiki-navigation-report
          path: wiki-navigation-report.json
          if-no-files-found: error
          retention-days: 30
