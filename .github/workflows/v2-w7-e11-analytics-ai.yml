name: CM-PharmE 2.0 W7-E11 Analytics and AI Evaluation

on:
  pull_request:
    branches:
      - v2/research-program
    paths:
      - 'v2/evaluation/protocol/e11-analytics-ai-eligibility.json'
      - 'tools/v2_evaluation/e11_analytics_ai_gate.py'
      - 'v2/data/**'
      - 'tools/v2_data/**'
      - '.github/workflows/v2-w7-e11-analytics-ai.yml'
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2/evaluation/protocol/e11-analytics-ai-eligibility.json'
      - 'tools/v2_evaluation/e11_analytics_ai_gate.py'
      - 'v2/data/**'
      - 'tools/v2_data/**'
      - '.github/workflows/v2-w7-e11-analytics-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w7-e11-analytics-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmpe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmpe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmpe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned evaluation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'psycopg[binary]==3.2.9'
          'rdflib==7.5.0'

      - name: Bootstrap reference PostgreSQL/PostGIS realization
        run: >-
          python tools/v2_data/bootstrap_ingest.py
          --reset
          --report build/w7-e11/ingest-report.json

      - name: Generate deterministic reference RDF/KG
        run: >-
          python tools/v2_data/export_kg.py
          --output build/w7-e11/cm-pharme-v2-fixture-kg.ttl
          --manifest build/w7-e11/kg-manifest.json

      - name: Re-run benchmark-backed analytics candidate AN-08
        run: >-
          python tools/v2_data/compare_sql_sparql.py
          --kg build/w7-e11/cm-pharme-v2-fixture-kg.ttl
          --report build/w7-e11/sql-sparql-equivalence.json

      - name: Evaluate E11 eligibility and claim gate
        run: >-
          python tools/v2_evaluation/e11_analytics_ai_gate.py
          --sql-sparql-report build/w7-e11/sql-sparql-equivalence.json
          --output build/w7-e11/e11-analytics-ai-evaluation.json
          --summary build/w7-e11/e11-analytics-ai-evaluation.md

      - name: Record E11 summary
        if: always()
        shell: bash
        run: |
          if [ -f build/w7-e11/e11-analytics-ai-evaluation.md ]; then
            cat build/w7-e11/e11-analytics-ai-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'W7-E11 report unavailable because execution failed before summary creation.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload W7-E11 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-w7-e11-analytics-ai-evidence
          path: |
            build/w7-e11/ingest-report.json
            build/w7-e11/kg-manifest.json
            build/w7-e11/sql-sparql-equivalence.json
            build/w7-e11/e11-analytics-ai-evaluation.json
            build/w7-e11/e11-analytics-ai-evaluation.md
            v2/evaluation/protocol/e11-analytics-ai-eligibility.json
          if-no-files-found: warn
          retention-days: 30
