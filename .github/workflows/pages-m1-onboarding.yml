# SPDX-License-Identifier: MIT
name: Released M1 Documentation Onboarding
on:
  pull_request:
    paths: ['docs/documentation/**', 'tools/pages/**', 'wiki-src/**', '.github/workflows/pages-m1-onboarding.yml']
  push:
    branches: ['docs/m1-release-337']
permissions:
  contents: read
jobs:
  m1-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: 77a8e854d0e3927b0687346d7f8fda6a398adda7
          path: _released_m1
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install existing pinned documentation dependencies
        run: python -m pip install 'rdflib==7.5.0' 'pyshacl==0.31.0' 'owlrl==7.1.4' 'jsonschema==4.25.1'
      - name: Verify real profile onboarding and previous-model isolation
        run: >-
          python tools/pages/test_released_profile_onboarding.py --source-root _released_m1
          --require-release-checkout --output build/m1-onboarding/report.json
      - name: Assemble reviewable profile input and Pages shell
        run: |
          python tools/pages/build_released_profile.py --source-root _released_m1 --contract docs/documentation/m1-profile-release.json --output-root build/m1-onboarding/input
          python tools/pages/resolve_documentation_input.py --version v2-m1 --source-ref release/2.1.0@77a8e854d0e3927b0687346d7f8fda6a398adda7 --build-root build/m1-onboarding/input --output build/m1-onboarding/resolved.json
          python tools/pages/package_download_bundle.py --version v2-m1 --build-root build/m1-onboarding/input --source-ref release/2.1.0@77a8e854d0e3927b0687346d7f8fda6a398adda7 --output-root build/m1-onboarding/site
          python tools/pages/build_shell.py --output build/m1-onboarding/site
          python tools/pages/run_version_pipeline.py plan --output build/m1-onboarding/common-plan.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cm-pharme-m1-onboarding-candidate
          path: build/m1-onboarding/
          retention-days: 30
