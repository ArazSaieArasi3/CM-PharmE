name: CM-PharmE 2.1 RDB-M1 Bounded Provenance

on:
  pull_request:
    branches:
      - v2/research-program
    paths:
      - 'v2/data/migrations/2.1/0.2.0/**'
      - '.github/workflows/v2-21-rdb-m1.yml'
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2/data/migrations/2.1/0.2.0/**'
      - '.github/workflows/v2-21-rdb-m1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copied-w6-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmpe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmpe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmpe
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned representation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'psycopg[binary]==3.2.9' 'rdflib==7.5.0' 'pyshacl==0.31.0'
      - name: Bootstrap isolated copied W6 fixture
        run: python tools/v2_data/bootstrap_ingest.py --reset --report build/v2-21-rdb-m1/ingest.json
      - name: Verify old four pairs and new versioned provenance pair
        run: python v2/data/migrations/2.1/0.2.0/verify_m1.py
      - name: Publish exact evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-v2-21-rdb-m1-evidence
          path: build/v2-21-rdb-m1/
          if-no-files-found: warn
          retention-days: 30
