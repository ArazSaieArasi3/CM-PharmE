name: Wiki Diagram Theme Migration

on:
  push:
    branches:
      - wiki/theme-safe-diagrams-and-db-2026-09
    paths:
      - 'tools/wiki/normalize_diagram_theme.py'
      - 'tools/wiki/check_diagrams.py'
      - 'tools/wiki/generate_v2_ontology_diagrams.py'
      - '.github/workflows/wiki-diagram-theme-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-pharme-wiki-diagram-theme-migration
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Checkout V2 ontology authority
        uses: actions/checkout@v4
        with:
          ref: v2/research-program
          path: _v2_authority
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize governed SVGs
        run: python tools/wiki/normalize_diagram_theme.py
      - name: Regenerate V2 ontology SVGs from authority
        run: python tools/wiki/generate_v2_ontology_diagrams.py --authority-root _v2_authority
      - name: Re-normalize generated SVGs
        run: python tools/wiki/normalize_diagram_theme.py
      - name: Validate diagram artifacts
        run: python tools/wiki/check_diagrams.py
      - name: Validate V2 ontology suite
        run: python tools/wiki/check_v2_ontology_diagram_suite.py
      - name: Verify ontology reference remains complete
        run: python tools/wiki/check_ontology_reference.py
      - name: Commit theme-safe diagrams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki-src/diagrams wiki-src/ontology-reference wiki-src/pages/V2-Module-*.md
          if git diff --cached --quiet; then
            echo "No theme migration changes to commit."
            exit 0
          fi
          git commit -m "Wiki diagrams: make governed SVGs browser-theme safe"
          git push origin HEAD:wiki/theme-safe-diagrams-and-db-2026-09
