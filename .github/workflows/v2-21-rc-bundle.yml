name: CM-PharmE 2.1 RC Bundle Clean Replay
on:
  pull_request:
    branches: [v2/research-program]
    paths:
      - 'v2/release/2.1/rc.1/bundle/**'
      - '.github/workflows/v2-21-rc-bundle.yml'
  push:
    branches: ['v2/**']
    paths:
      - 'v2/release/2.1/rc.1/bundle/**'
      - '.github/workflows/v2-21-rc-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-bundle-and-fresh-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Checkout immutable payload source
        uses: actions/checkout@v7.0.1
        with:
          ref: 64edf150db8a78579928fd99b5a381f665c1afdf
          path: build/rc02-payload-source
          persist-credentials: false
      - name: Build twice and verify deterministic archive and refusal controls
        run: >-
          python v2/release/2.1/rc.1/bundle/build_bundle.py
          --source-root build/rc02-payload-source
          --scope-root v2/release/2.1/rc.1/scope
          --output-dir build/rc02-bundle
      - name: Replay extracted source with newly installed isolated dependencies
        run: >-
          python v2/release/2.1/rc.1/bundle/replay_bundle.py
          --archive build/rc02-bundle/cm-pharme-2.1.0-rc.1.tar
          --sha256-file build/rc02-bundle/cm-pharme-2.1.0-rc.1.tar.sha256
          --work-root build/rc02-cold
          --output build/rc02-bundle/replay-results.json
      - name: Expose exact portable build and replay results
        if: always()
        run: |
          for report in build/rc02-bundle/build-results.json build/rc02-bundle/replay-results.json; do
            if test -f "$report"; then cat "$report"; fi
          done
      - name: Upload prepared archive, hashes and bounded replay evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-2.1.0-rc.1-prepared-bundle
          path: |
            build/rc02-bundle/
            build/rc02-cold/results/
            build/rc02-cold/environment.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
