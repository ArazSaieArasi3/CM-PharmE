name: Ontology DL Reasoner Validation

on:
  push:
    branches:
      - evaluation/b4-paper-grounded-validation-v1
    paths:
      - 'ontology/**'
      - 'tools/ontology/**'
      - '.github/workflows/ontology-reasoner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermit-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBOT_VERSION: '1.9.10'
      ROBOT_SHA256: '16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deterministic RDF dependency
        run: python -m pip install --disable-pip-version-check 'rdflib==7.5.0'

      - name: Assemble modular ontology source
        run: python tools/ontology/assemble_modules.py

      - name: Download and verify ROBOT
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/ontodev/robot/releases/download/v${ROBOT_VERSION}/robot.jar" \
            --output build/ontology/robot.jar
          echo "${ROBOT_SHA256}  build/ontology/robot.jar" | sha256sum --check --strict
          java -jar build/ontology/robot.jar --version | tee build/ontology/robot-version.txt

      - name: Run ROBOT with HermiT logical validation
        id: reason
        shell: bash
        run: |
          set +e
          set -o pipefail
          java -jar build/ontology/robot.jar reason \
            --reasoner hermit \
            --input build/ontology/cm-pharme.ttl \
            --dump-unsatisfiable build/ontology/unsatisfiable.owl \
            --output build/ontology/cm-pharme-reasoned.owl \
            2>&1 | tee build/ontology/robot-hermit.log
          exit_code=${PIPESTATUS[0]}
          echo "${exit_code}" > build/ontology/robot-hermit.exitcode
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Create machine-readable reasoner summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          build = Path('build/ontology')
          exit_path = build / 'robot-hermit.exitcode'
          exit_code = int(exit_path.read_text().strip()) if exit_path.exists() else None
          summary = {
              'schema_version': 1,
              'tool': 'ROBOT',
              'robot_version': '1.9.10',
              'reasoner': 'HermiT',
              'robot_sha256': '16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105',
              'input': 'build/ontology/cm-pharme.ttl',
              'exit_code': exit_code,
              'logical_validation_passed': exit_code == 0,
              'interpretation': (
                  'PASS: ROBOT/HermiT completed logical validation and classification.'
                  if exit_code == 0
                  else 'FAIL: inspect robot-hermit.log and unsatisfiable.owl when present.'
              ),
          }
          (build / 'reasoner-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CM-PharmE ROBOT/HermiT validation'
            echo
            echo "- ROBOT: v${ROBOT_VERSION}"
            echo '- Reasoner: HermiT'
            echo "- ROBOT SHA-256: ${ROBOT_SHA256}"
            echo "- Exit code: ${{ steps.reason.outputs.exit_code }}"
            echo
            echo 'ROBOT performs logical validation before classification; a non-zero result is treated as a failed logical validation and must not be replaced by structural evidence.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reasoner evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-b4-10-hermit-evidence
          path: |
            build/ontology/assembly-manifest.json
            build/ontology/cm-pharme.ttl
            build/ontology/cm-pharme-reasoned.owl
            build/ontology/robot-version.txt
            build/ontology/robot-hermit.log
            build/ontology/robot-hermit.exitcode
            build/ontology/reasoner-summary.json
            build/ontology/unsatisfiable.owl
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce reasoner result
        if: always()
        shell: bash
        run: |
          test -f build/ontology/robot-hermit.exitcode
          test "$(cat build/ontology/robot-hermit.exitcode)" = '0'
