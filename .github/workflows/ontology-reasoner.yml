name: CM-PharmE Ontology CI

on:
  pull_request:
    paths:
      - 'ontology/**'
      - 'tools/ontology/**'
      - 'evaluation/**'
      - '.github/workflows/ontology-reasoner.yml'
  push:
    branches:
      - main
      - automation/b5-reproducible-build-v1
    paths:
      - 'ontology/**'
      - 'tools/ontology/**'
      - 'evaluation/**'
      - '.github/workflows/ontology-reasoner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ontology-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROBOT_VERSION: '1.9.10'
      ROBOT_SHA256: '16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned RDF dependency
        run: python -m pip install --disable-pip-version-check 'rdflib==7.5.0'

      - name: Build deterministic ontology artifacts — pass A
        run: python tools/ontology/build.py --output-root build/ontology-artifacts-a

      - name: Build deterministic ontology artifacts — pass B
        run: python tools/ontology/build.py --output-root build/ontology-artifacts-b

      - name: Verify independent builds are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          diff -qr build/ontology-artifacts-a build/ontology-artifacts-b

      - name: Validate graph, SHACL and serializations
        run: >-
          python tools/ontology/validate.py
          --artifact-root build/ontology-artifacts-a
          --report build/ontology-artifacts-a/validation/quality-report.json

      - name: Execute competency-question regression suite
        run: >-
          python tools/ontology/run_cqs.py
          --ontology build/ontology-artifacts-a/source/cm-pharme.ttl
          --output build/ontology-artifacts-a/validation/cq-report.json

      - name: Download and verify ROBOT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/robot
          curl --fail --location --silent --show-error \
            "https://github.com/ontodev/robot/releases/download/v${ROBOT_VERSION}/robot.jar" \
            --output build/robot/robot.jar
          echo "${ROBOT_SHA256}  build/robot/robot.jar" | sha256sum --check --strict
          java -jar build/robot/robot.jar --version | tee build/robot/robot-version.txt

      - name: Run ROBOT with HermiT logical validation
        id: reason
        shell: bash
        run: |
          set +e
          set -o pipefail
          java -jar build/robot/robot.jar reason \
            --reasoner hermit \
            --input build/ontology-artifacts-a/source/cm-pharme.ttl \
            --dump-unsatisfiable build/robot/unsatisfiable.owl \
            --output build/robot/cm-pharme-reasoned.owl \
            2>&1 | tee build/robot/robot-hermit.log
          exit_code=${PIPESTATUS[0]}
          echo "${exit_code}" > build/robot/robot-hermit.exitcode
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Create reasoner summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/robot/robot-hermit.exitcode')
          exit_code = int(p.read_text().strip()) if p.exists() else None
          summary = {
              'schema_version': 1,
              'tool': 'ROBOT',
              'robot_version': '1.9.10',
              'reasoner': 'HermiT',
              'robot_sha256': '16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105',
              'input': 'build/ontology-artifacts-a/source/cm-pharme.ttl',
              'exit_code': exit_code,
              'logical_validation_passed': exit_code == 0,
          }
          Path('build/robot/reasoner-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY

      - name: Build deterministic release bundle twice
        shell: bash
        run: |
          set -euo pipefail
          python tools/ontology/package_release.py \
            --artifact-root build/ontology-artifacts-a \
            --output build/cm-pharme-ontology-artifacts-a.zip
          python tools/ontology/package_release.py \
            --artifact-root build/ontology-artifacts-a \
            --output build/cm-pharme-ontology-artifacts-b.zip
          cmp --silent build/cm-pharme-ontology-artifacts-a.zip build/cm-pharme-ontology-artifacts-b.zip
          mv build/cm-pharme-ontology-artifacts-a.zip build/cm-pharme-ontology-artifacts.zip
          rm build/cm-pharme-ontology-artifacts-b.zip
          sha256sum build/cm-pharme-ontology-artifacts.zip | tee build/cm-pharme-ontology-artifacts.zip.sha256

      - name: Publish CI summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CM-PharmE ontology quality gates'
            echo
            echo '- Full B3 graph parity target: 1,086 triples'
            echo '- SHACL target: 574 triples / 76 node shapes / 76 property shapes'
            echo '- Competency queries: 8 executable regression checks'
            echo "- ROBOT: v${ROBOT_VERSION}"
            echo '- Reasoner: HermiT'
            echo "- HermiT exit code: ${{ steps.reason.outputs.exit_code }}"
            echo '- Two clean builds are required to be byte-identical; distributions are published as CI/release artifacts, not hand-maintained repository files.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cm-pharme-b5-ontology-ci-evidence
          path: |
            build/ontology-artifacts-a/
            build/robot/
            build/cm-pharme-ontology-artifacts.zip
            build/cm-pharme-ontology-artifacts.zip.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce reasoner result
        if: always()
        shell: bash
        run: |
          test -f build/robot/robot-hermit.exitcode
          test "$(cat build/robot/robot-hermit.exitcode)" = '0'
