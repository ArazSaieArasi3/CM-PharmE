name: Pages Download Bundle

on:
  pull_request:
    paths:
      - "docs/documentation/download-bundle-contract.json"
      - "docs/documentation/pages-273-download-contract.md"
      - "docs/documentation/ontology-version-registry.json"
      - "docs/documentation/ontology-documentation-build-contract.json"
      - "docs/documentation/m1-profile-release.json"
      - "tools/pages/run_version_pipeline.py"
      - "tools/pages/build_released_profile.py"
      - "tools/pages/package_download_bundle.py"
      - "tools/pages/test_download_contract.py"
      - "tools/pages/test_download_integration.py"
      - "tools/pages/audit_download_closure.py"
      - "tools/pages/build_shell.py"
      - ".github/workflows/pages-download-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build and verify every registered download bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned semantic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'rdflib==7.5.0'
          'pyshacl==0.31.0'

      - name: Checkout, rebuild and gate every registered source
        run: |
          python tools/pages/run_version_pipeline.py checkout
          python tools/pages/run_version_pipeline.py inputs

      - name: Validate download contract, V3 dry run and collision guard
        run: python tools/pages/test_download_contract.py

      - name: Package every registered download bundle
        run: python tools/pages/run_version_pipeline.py downloads

      - name: Verify version isolation and mandatory files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import json
          from pathlib import Path
          registry=json.loads(Path("docs/documentation/ontology-version-registry.json").read_text())
          routes=[]
          for version in registry["versions"]:
              route=version.get("immutable_version_path") or version["current_path"]
              assert route not in routes, route
              routes.append(route)
              folder=Path("build/site")/route/"downloads"
              for name in ("download-manifest.json", "provenance.json", "SHA256SUMS.txt"):
                  assert (folder/name).stat().st_size > 0, folder/name
              assert len(list(folder.iterdir())) == 8, folder
              manifest=json.loads((folder/"download-manifest.json").read_text())
              assert manifest["lifecycle_state"] == version["lifecycle_state"]
              assert manifest["public_status_label"] == version["public_status_label"]
          CHECK

      - name: Negative test — refuse silent V1 bundle overwrite
        shell: bash
        run: |
          set +e
          python tools/pages/package_download_bundle.py \
            --version v1 \
            --build-root build/input/v1 \
            --source-ref main@595ea30a66644c1b130b6c1a781dc7afbd7ba284 \
            --output-root build/site
          status=$?
          set -e
          test "$status" -ne 0

      - name: Build shell around verified bundles
        run: python tools/pages/build_shell.py --output build/site

      - name: Audit assembled download pages and sample downloads
        run: python tools/pages/test_download_integration.py --site build/site

      - name: Final #273 URL/path and traceability audit
        run: >-
          python tools/pages/audit_download_closure.py
          --site build/site
          --output build/evidence/pages-273-final-audit.json

      - name: Upload verified assembled Pages candidate
        uses: actions/upload-artifact@v4
        with:
          name: cm-pharme-pages-download-integration
          path: |
            build/site/
            build/evidence/
          if-no-files-found: error
