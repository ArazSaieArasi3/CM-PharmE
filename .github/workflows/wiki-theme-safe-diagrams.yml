name: Wiki Theme-Safe Diagram Migration

on:
  push:
    branches:
      - wiki/theme-safe-diagrams-and-db-2026-09
    paths:
      - 'tools/wiki/normalize_diagram_theme.py'
      - 'tools/wiki/generate_v2_ontology_diagrams.py'
      - 'tools/wiki/check_diagrams.py'
      - '.github/workflows/wiki-theme-safe-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cm-pharme-wiki-theme-safe-diagrams
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Checkout V2 authority
        uses: actions/checkout@v4
        with:
          ref: v2/research-program
          path: _v2_authority
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate V2 ontology diagrams natively theme-safe
        run: python tools/wiki/generate_v2_ontology_diagrams.py --authority-root _v2_authority
      - name: Normalize all governed SVGs
        run: python tools/wiki/normalize_diagram_theme.py
      - name: Synchronize cache-busted Wiki image URLs
        run: python tools/wiki/sync_diagram_image_urls.py
      - name: Validate diagram artifact contract
        run: python tools/wiki/check_diagrams.py
      - name: Validate V2 ontology diagram suite
        run: python tools/wiki/check_v2_ontology_diagram_suite.py
      - name: Commit migrated diagrams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki-src/diagrams wiki-src/ontology-reference wiki-src/pages
          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
            exit 0
          fi
          git commit -m "Wiki diagrams: make governed SVGs browser and dark-mode safe"
          git push origin HEAD:wiki/theme-safe-diagrams-and-db-2026-09
